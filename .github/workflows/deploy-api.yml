name: Deploy BarberShop API

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_PATH: BarberShop.Api/BarberShop.Api.csproj
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore API
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build API
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Zip API
        run: |
          cd publish
          zip -r ../api.zip .

      - name: Deploy API with Kudu ZipDeploy
        env:
          API_PUBLISH_USERNAME: ${{ secrets.API_PUBLISH_USERNAME }}
          API_PUBLISH_PASSWORD: ${{ secrets.API_PUBLISH_PASSWORD }}
          API_ZIPDEPLOY_URL: ${{ secrets.API_ZIPDEPLOY_URL }}
        run: |
          curl -f -X POST \
            -u "$API_PUBLISH_USERNAME:$API_PUBLISH_PASSWORD" \
            --data-binary "@api.zip" \
            "$API_ZIPDEPLOY_URL"
